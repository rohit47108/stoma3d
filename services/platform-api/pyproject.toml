[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "stoma3d-platform-api"
version = "0.1.0"
description = "Stateful identity, sync, audit, and lifecycle API for Stoma3D"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "boto3>=1.40,<2",
  "cryptography==50.0.0",
  "fastapi==0.139.2",
  "pydantic-settings>=2.12,<3",
  "pillow==12.3.0",
  "pyjwt[crypto]>=2.15.1,<3",
  "python-multipart>=0.0.22,<1",
  "redis[hiredis]>=6.4,<8",
  "reportlab>=4.4,<5",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  # Keep boto3's HTTP transport above the reviewed security-fix floor.
  "urllib3>=2.8,<3",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "pypdf>=6.0,<7",
]

[project.scripts]
stoma3d-platform-api = "stoma3d_platform.main:run"
stoma3d-bootstrap-admin = "stoma3d_platform.admin_bootstrap:main"
stoma3d-add-admin = "stoma3d_platform.admin_bootstrap:add_admin_main"
stoma3d-recover-admin = "stoma3d_platform.admin_bootstrap:recover_admin_main"

[tool.hatch.build.targets.wheel]
packages = ["src/stoma3d_platform"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["stoma3d_platform"]
